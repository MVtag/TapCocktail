name: Apply carbonation room sensor settings

on:
  push:
    branches:
      - agent/carbonation-room-sensor-settings

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/carbonation-room-sensor-settings

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply settings change
        run: python .github/scripts/apply_carbonation_room_sensor_settings.py

      - name: Validate Python and JSON
        run: |
          python -m compileall -q custom_components/tapcocktail
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [
              Path('custom_components/tapcocktail/manifest.json'),
              Path('custom_components/tapcocktail/strings.json'),
              Path('custom_components/tapcocktail/translations/da.json'),
              Path('custom_components/tapcocktail/translations/en.json'),
          ]:
              json.loads(path.read_text(encoding='utf-8'))
          PY

      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/tapcocktail
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Move carbonation room sensor into settings'
            git push origin HEAD:agent/carbonation-room-sensor-settings
          fi
