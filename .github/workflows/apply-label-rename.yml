name: Apply carbonation room sensor label rename

on:
  push:
    branches:
      - agent/rename-carbonation-room-sensor

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/rename-carbonation-room-sensor

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply label rename
        run: python .github/scripts/rename_carbonation_room_sensor.py

      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [
              Path('custom_components/tapcocktail/manifest.json'),
              Path('custom_components/tapcocktail/strings.json'),
              Path('custom_components/tapcocktail/translations/da.json'),
              Path('custom_components/tapcocktail/translations/en.json'),
          ]:
              json.loads(path.read_text(encoding='utf-8'))
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/tapcocktail
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Rename carbonation room temperature sensor label'
            git push origin HEAD:agent/rename-carbonation-room-sensor
          fi
