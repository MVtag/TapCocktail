name: Publish release

on:
  push:
    branches:
      - main
    paths:
      - custom_components/tapcocktail/manifest.json

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read integration version
        id: version
        shell: bash
        run: |
          version="$(python -c 'import json; print(json.load(open("custom_components/tapcocktail/manifest.json", encoding="utf-8"))["version"])')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi

          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "TapCocktail $tag" \
            --generate-notes
