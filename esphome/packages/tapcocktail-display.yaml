# TapCocktail display package for LILYGO T-RGB 2.1" with FT3267 touch.
# Set `tap` in the device YAML to select hane 1, 2, 3, ... 8.

substitutions:
  tap: "1"
  image_base_url: "https://raw.githubusercontent.com/MVtag/TapCocktail/main/esphome/images"

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

globals:
  - id: vis_klar_side
    type: bool
    restore_value: no
    initial_value: "true"

i2c:
  sda: GPIO8
  scl: GPIO48

xl9535:
  - id: xl9535_hub
    address: 0x20

spi:
  clk_pin:
    xl9535: xl9535_hub
    number: 5
  mosi_pin:
    xl9535: xl9535_hub
    number: 4
  interface: software

touchscreen:
  - platform: ft63x6
    id: tapcocktail_touch
    display: tapcocktail_screen
    address: 0x38
    interrupt_pin: GPIO1

    reset_pin:
      xl9535: xl9535_hub
      number: 1
      mode:
        output: true

    on_release:
      - lambda: |-
          ESP_LOGI("touch", "Touch sluppet");

          if (
            id(tap_status).has_state() &&
            id(tap_status).state == "ready"
          ) {
            id(vis_klar_side) = !id(vis_klar_side);
            id(tapcocktail_screen).update();
          }

sensor:
  - platform: homeassistant
    id: cocktail_co2
    entity_id: sensor.tapcocktail_hane_${tap}
    attribute: co2
    internal: true

  - platform: homeassistant
    id: cocktail_abv
    entity_id: sensor.tapcocktail_hane_${tap}
    attribute: abv
    internal: true

  - platform: homeassistant
    id: cocktail_temperature
    entity_id: sensor.tapcocktail_hane_${tap}
    attribute: temperatur
    internal: true

  - platform: homeassistant
    id: shelf_life_remaining_days
    entity_id: sensor.tapcocktail_hane_${tap}
    attribute: holdbarhed_resterende_dage
    internal: true

text_sensor:
  - platform: homeassistant
    id: cocktail_name
    entity_id: sensor.tapcocktail_hane_${tap}
    attribute: navn
    internal: true

  - platform: homeassistant
    id: cocktail_color
    entity_id: sensor.tapcocktail_hane_${tap}
    attribute: farve
    internal: true

  - platform: homeassistant
    id: cocktail_icon
    entity_id: sensor.tapcocktail_hane_${tap}
    attribute: ikon
    internal: true

  - platform: homeassistant
    id: cocktail_theme
    entity_id: sensor.tapcocktail_hane_${tap}
    attribute: tema
    internal: true

  - platform: homeassistant
    id: cocktail_glass
    entity_id: sensor.tapcocktail_hane_${tap}
    attribute: glas
    internal: true

  - platform: homeassistant
    id: tap_status
    entity_id: sensor.hane_${tap}_status
    internal: true

  - platform: homeassistant
    id: shelf_life_status
    entity_id: sensor.tapcocktail_hane_${tap}
    attribute: holdbarhed_status
    internal: true

  - platform: homeassistant
    id: carbonation_remaining
    entity_id: sensor.hane_${tap}_remaining
    internal: true

font:
  - file: "gfonts://Roboto@700"
    id: cocktail_font_stor
    size: 58
    bpp: 4
    glyphsets:
      - GF_Latin_Core

  - file: "gfonts://Roboto@700"
    id: cocktail_font_mellem
    size: 48
    bpp: 4
    glyphsets:
